<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发票信息</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html {
    height: 100vh;
    overflow: hidden; /* 全局禁止滚动 */
}
body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    padding: 6vh 4vw;
}

/* 容器1：标题+顶部说明 */
.box-header {
    text-align: center;
}
.box-header h1 {
    font-size: 6.2vw;
    font-weight: bold;
    margin-bottom: 4vh;
    color: #000;
}
.top-desc-wrap {
    width: 82vw;
    margin: 0 auto;
    font-size: 4vw;
    color: #666;
    line-height: 1.8;
}

/* 容器2：发票数据列表 */
.box-data {
    margin-top: 6vh;
}
.data-row {
    display: flex;
    margin-bottom: 4vh;
    font-size: 4vw;
}
.data-label {
    width: 32vw;
    color: #999;
    flex-shrink: 0;
}
.data-value {
    color: #000;
}

/* 容器3：自适应空白填充 */
.box-empty {
    flex: 1;
    min-height: 18vh;
}

/* 容器4：底部说明 */
.box-footer {
    text-align: center;
}
.bottom-desc-wrap {
    width: 82vw;
    margin: 0 auto;
    font-size: 3.4vw;
    color: #999;
    line-height: 1.8;
}
</style>
</head>
<body>
    <!-- 容器1 头部标题与说明 -->
    <div class="box-header">
        <h1>发票信息</h1>
        <div class="top-desc-wrap">
            以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。
        </div>
    </div>

    <!-- 容器2 发票数据 -->
    <div class="box-data">
        <div class="data-row">
            <span class="data-label">发票代码</span>
            <span class="data-value">3300214130</span>
        </div>
        <div class="data-row">
            <span class="data-label">发票号码</span>
            <span class="data-value">25423381</span>
        </div>
        <div class="data-row">
            <span class="data-label">合计金额</span>
            <span class="data-value">¥784928.56(不含税)</span>
        </div>
        <div class="data-row">
            <span class="data-label">开票日期</span>
            <span class="data-value">2023.08.04</span>
        </div>
    </div>

    <!-- 容器3 空白区域 -->
    <div class="box-empty"></div>

    <!-- 容器4 底部页尾 -->
    <div class="box-footer">
        <div class="bottom-desc-wrap">
            如需查验发票真伪，请通过税务机关提供的官方渠道<br>进行查验。
        </div>
    </div>
</body>
</html>
