<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发票信息</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #ffffff;
    padding: 70px 32px;
    min-height: 100vh;
}
h1{
    font-size: 42px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 36px;
    color: #000;
}
.top-desc{
    font-size: 26px;
    color: #666666;
    text-align: center;
    line-height: 1.8;
    margin-bottom: 120px;
}
.item-wrap{
    margin-bottom: 42px;
    display: flex;
    align-items: center;
}
.label{
    width: 160px;
    font-size: 26px;
    color: #999999;
    flex-shrink: 0;
}
.value{
    font-size: 26px;
    color: #000000;
}
.bottom-desc{
    margin-top: 220px;
    font-size: 22px;
    color: #999999;
    text-align: center;
    line-height: 1.8;
}
</style>
</head>
<body>
    <h1>发票信息</h1>
    <!-- 强制2行，和目标图完全一致 -->
    <p class="top-desc">
        以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。
    </p>

    <div class="list">
        <div class="item-wrap">
            <span class="label">发票代码</span>
            <span class="value">3300214130</span>
        </div>
        <div class="item-wrap">
            <span class="label">发票号码</span>
            <span class="value">25423381</span>
        </div>
        <div class="item-wrap">
            <span class="label">合计金额</span>
            <span class="value">¥784928.56(不含税)</span>
        </div>
        <div class="item-wrap">
            <span class="label">开票日期</span>
            <span class="value">2023.08.04</span>
        </div>
    </div>

    <!-- 强制2行，和目标图完全一致 -->
    <p class="bottom-desc">
        如需查验发票真伪，请通过税务机关提供的官方渠道<br>进行查验。
    </p>
</body>
</html>
