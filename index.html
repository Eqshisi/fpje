<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="发票信息" />
    <title>发票信息</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100%;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #FFFFFF;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      
      /* 内容区域 */
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 30px 20px 0;
      }
      
      /* 标题区 */
      .title-section {
        text-align: center;
        margin-bottom: 40px;
      }
      
      .main-title {
        font-size: 22px;
        font-weight: 600;
        color: #000000;
        margin-bottom: 20px;
      }
      
      .notice {
        font-size: 14px;
        color: #333333;
        line-height: 1.6;
        text-align: center;
      }
      
      /* 发票信息 改动部分 */
      .info-section {
        padding: 0 20px;
      }
      
      .info-item {
        display: flex;
        align-items: flex-start;
        padding: 14px 0;
      }
      
      .info-label {
        font-size: 14px;
        color: #666666;
        flex-shrink: 0;
        width: 90px;
      }
      
      .info-value {
        font-size: 14px;
        color: #000000;
        text-align: left;
      }
      /* 改动结束 */
      
      /* 底部提示 */
      .footer {
        padding: 40px 20px 20px;
        text-align: center;
        margin-top: auto;
      }
      
      .footer-text {
        font-size: 12px;
        color: #999999;
        line-height: 1.6;
      }
      
      /* 底部导航条 */
      .home-indicator {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 8px 0 6px;
      }
      
      .home-indicator-bar {
        width: 134px;
        height: 5px;
        background-color: #000000;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <!-- 内容区域 -->
    <div class="content">
      <!-- 标题区 -->
      <div class="title-section">
        <h1 class="main-title">发票信息</h1>
        <p class="notice">以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。</p>
      </div>
      
      <!-- 发票信息 -->
      <div class="info-section">
        <div class="info-item">
          <span class="info-label">发票代码</span>
          <span class="info-value">3300214130</span>
        </div>
        <div class="info-item">
          <span class="info-label">发票号码</span>
          <span class="info-value">25423381</span>
        </div>
        <div class="info-item">
          <span class="info-label">合计金额</span>
          <span class="info-value">¥784928.56(不含税)</span>
        </div>
        <div class="info-item">
          <span class="info-label">开票日期</span>
          <span class="info-value">2023.08.04</span>
        </div>
      </div>
      
      <!-- 底部提示 -->
      <div class="footer">
        <p class="footer-text">如需查验发票真伪，请通过税务机关提供的官方渠<br>道进行查验。</p>
      </div>
    </div>
    
    <!-- 底部导航条 -->
    <div class="home-indicator">
      <div class="home-indicator-bar"></div>
    </div>
  </body>
</html>
