<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发票信息</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #fff;
    min-height: 100vh;
    padding: 80px 20px;
}
/* 整体内容居中容器，限制最大宽度，锁定文字换行 */
.container {
    max-width: 620px;
    margin: 0 auto;
}
.main-title {
    font-size: 44px;
    font-weight: bold;
    text-align: center;
    color: #000;
    margin-bottom: 40px;
}
.top-text-box {
    max-width: 540px;
    margin: 0 auto 130px;
    font-size: 27px;
    color: #666;
    text-align: center;
    line-height: 1.7;
}
.info-row {
    display: flex;
    align-items: center;
    margin-bottom: 45px;
}
.info-label {
    width: 170px;
    font-size: 27px;
    color: #999;
    flex-shrink: 0;
}
.info-value {
    font-size: 27px;
    color: #000;
}
.bottom-text-box {
    max-width: 540px;
    margin-top: 240px;
    font-size: 23px;
    color: #999;
    text-align: center;
    line-height: 1.7;
}
</style>
</head>
<body>
<div class="container">
    <h1 class="main-title">发票信息</h1>

    <!-- 固定宽度容器强制两行，不会多出第三行 -->
    <div class="top-text-box">
        以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。
    </div>

    <div class="info-list">
        <div class="info-row">
            <span class="info-label">发票代码</span>
            <span class="info-value">3300214130</span>
        </div>
        <div class="info-row">
            <span class="info-label">发票号码</span>
            <span class="info-value">25423381</span>
        </div>
        <div class="info-row">
            <span class="info-label">合计金额</span>
            <span class="info-value">¥784928.56(不含税)</span>
        </div>
        <div class="info-row">
            <span class="info-label">开票日期</span>
            <span class="info-value">2023.08.04</span>
        </div>
    </div>

    <!-- 底部文字同样锁定宽度，强制两行 -->
    <div class="bottom-text-box">
        如需查验发票真伪，请通过税务机关提供的官方渠道<br>进行查验。
    </div>
</div>
</body>
</html>
