<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发票信息</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    padding: 60px 30px;
    display: flex;
    flex-direction: column;
}

/* 区块1：头部标题+顶部说明 */
.block-header {
    text-align: center;
}
.block-header h1 {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 32px;
    color: #000;
}
.block-header .top-tip {
    font-size: 24px;
    color: #666;
    line-height: 1.7;
}

/* 区块2：发票数据列表 */
.block-data {
    margin-top: 100px;
}
.data-row {
    display: flex;
    margin-bottom: 38px;
    font-size: 24px;
}
.data-label {
    width: 150px;
    color: #999;
    flex-shrink: 0;
}
.data-value {
    color: #000;
}

/* 区块3：空白填充区域（核心！撑开中间空白） */
.block-empty {
    flex-grow: 1;
    min-height: 220px;
}

/* 区块4：页尾底部提示 */
.block-footer {
    text-align: center;
    font-size: 20px;
    color: #999;
    line-height: 1.7;
}
</style>
</head>
<body>
    <!-- 区块1：头部标题与顶部说明 -->
    <div class="block-header">
        <h1>发票信息</h1>
        <p class="top-tip">
            以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。
        </p>
    </div>

    <!-- 区块2：发票数据内容 -->
    <div class="block-data">
        <div class="data-row">
            <span class="data-label">发票代码</span>
            <span class="data-value">3300214130</span>
        </div>
        <div class="data-row">
            <span class="data-label">发票号码</span>
            <span class="data-value">25423381</span>
        </div>
        <div class="data-row">
            <span class="data-label">合计金额</span>
            <span class="data-value">¥784928.56(不含税)</span>
        </div>
        <div class="data-row">
            <span class="data-label">开票日期</span>
            <span class="data-value">2023.08.04</span>
        </div>
    </div>

    <!-- 区块3：空白填充区域，实现页面中间大片留白 -->
    <div class="block-empty"></div>

    <!-- 区块4：页面底部提示文字 -->
    <div class="block-footer">
        <p>
            如需查验发票真伪，请通过税务机关提供的官方渠道<br>进行查验。
        </p>
    </div>
</body>
</html>
