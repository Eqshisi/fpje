<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>发票信息</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #ffffff;
}
body {
    display: flex;
    flex-direction: column;
    padding: 64px 32px;
}

/* 第一块容器：标题+顶部说明文字 */
.box1 {
    text-align: center;
}
.box1 h1 {
    font-size: 42px;
    font-weight: bold;
    color: #000;
    margin-bottom: 36px;
}
.box1 .topText {
    font-size: 26px;
    color: #666666;
    line-height: 1.7;
}

/* 第二块容器：发票4行数据 */
.box2 {
    margin-top: 100px;
}
.dataLine {
    display: flex;
    margin-bottom: 40px;
    font-size: 26px;
}
.dataLabel {
    width: 152px;
    color: #999999;
    flex-shrink: 0;
}
.dataVal {
    color: #000000;
}

/* 第三块容器：空白占位，撑起中间大片空白 */
.boxEmpty {
    flex-grow: 1;
}

/* 第四块容器：底部页尾提示文字 */
.boxFooter {
    text-align: center;
    font-size: 22px;
    color: #999999;
    line-height: 1.7;
}
</style>
</head>
<body>
    <!-- 容器1：标题+顶部说明 -->
    <div class="box1">
        <h1>发票信息</h1>
        <p class="topText">
            以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。
        </p>
    </div>

    <!-- 容器2：发票数据列表 -->
    <div class="box2">
        <div class="dataLine">
            <span class="dataLabel">发票代码</span>
            <span class="dataVal">3300214130</span>
        </div>
        <div class="dataLine">
            <span class="dataLabel">发票号码</span>
            <span class="dataVal">25423381</span>
        </div>
        <div class="dataLine">
            <span class="dataLabel">合计金额</span>
            <span class="dataVal">¥784928.56(不含税)</span>
        </div>
        <div class="dataLine">
            <span class="dataLabel">开票日期</span>
            <span class="dataVal">2023.08.04</span>
        </div>
    </div>

    <!-- 容器3：空白区域（核心实现原图中间留白） -->
    <div class="boxEmpty"></div>

    <!-- 容器4：页尾文字 -->
    <div class="boxFooter">
        <p>
            如需查验发票真伪，请通过税务机关提供的官方渠道<br>进行查验。
        </p>
    </div>
</body>
</html>
