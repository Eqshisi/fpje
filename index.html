<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>发票信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            padding: 40px 20px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .tip-top {
            font-size: 16px;
            color: #666;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 60px;
        }
        .item-box {
            margin-bottom: 24px;
            display: flex;
        }
        .label {
            width: 90px;
            color: #999;
            font-size: 16px;
            flex-shrink: 0;
        }
        .value {
            font-size: 16px;
            color: #000;
        }
        .tip-bottom {
            margin-top: 100px;
            font-size: 14px;
            color: #999;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h2 class="title">发票信息</h2>
    <p class="tip-top">
        以下信息仅为发票二维码所含信息，并不<br>代表查验发票真伪的结果。
    </p>

    <div class="item-list">
        <div class="item-box">
            <span class="label">发票代码</span>
            <span class="value">3300214130</span>
        </div>
        <div class="item-box">
            <span class="label">发票号码</span>
            <span class="value">25423381</span>
        </div>
        <div class="item-box">
            <span class="label">合计金额</span>
            <span class="value">¥784928.56(不含税)</span>
        </div>
        <div class="item-box">
            <span class="label">开票日期</span>
            <span class="value">2023.08.04</span>
        </div>
    </div>

    <p class="tip-bottom">
        如需查验发票真伪，请通过税务机关提供的官方渠道<br>进行查验。
    </p>
</body>
</html>
